name: Linux Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pinned Flutter version
        id: flutter-version
        shell: bash
        run: |
          python3 -c 'import json; print("version=" + json.load(open(".fvmrc"))["flutter"])' >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config patchelf \
            libgtk-3-dev libjson-glib-dev liblzma-dev libstdc++-12-dev \
            libx11-dev libxi-dev \
            xz-utils zstd
      - run: dart pub global activate fastforge 0.6.6
      - name: Restore bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: linux/ffmpeg/.cache
          key: linux-ffmpeg-kit-${{ hashFiles('linux/ffmpeg/complete_kit.py') }}
      - name: Restore MDK Linux SDK
        uses: actions/cache@v4
        with:
          path: |
            third/fvp/linux/mdk-sdk
            third/fvp/linux/mdk-sdk-linux-x64.tar.xz
          key: mdk-linux-${{ hashFiles('third/fvp/cmake/deps.cmake') }}
      - run: flutter pub get
      - name: Build archive
        run: fastforge release --name release --jobs linux-zip --skip-clean
      - name: Upload Linux test archive
        uses: actions/upload-artifact@v4
        with:
          name: reveric-linux-test-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/**/*-linux.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
