  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/logo/reveric_app_icon_macos_1024.png
  windows:
    generate: true
    image_path: assets/logo/reveric_app_icon_macos_1024.png
  linux:
    generate: true
    image_path: assets/logo/reveric_app_icon_ios_1024.png
  image_path: assets/logo/reveric_app_icon_ios_1024.png
  adaptive_icon_background: assets/logo/reveric_adaptive_icon_background_432.png
  adaptive_icon_foreground: assets/logo/reveric_adaptive_icon_foreground_432.png
  remove_alpha_ios: true

patrol:
  app_name: Reveric
  android:
    package_name: ai.reveric.debug
  ios:
    bundle_id: ai.reveric.debug
  macos:
    bundle_id: ai.reveric.debug

